name: tramcast

x-app: &app
  image: tramcast-app:local
  build:
    context: .
    target: app
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
    POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-0}
    POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-5s}
    POSTGRES_STARTUP_TIMEOUT: ${POSTGRES_STARTUP_TIMEOUT:-10s}
    HTTP_ADDR: ":8080"
    HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
    HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
    HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
    HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
    HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
    HTTP_PROBE_TIMEOUT: ${HTTP_PROBE_TIMEOUT:-2s}
    LOGGER_LEVEL: ${LOGGER_LEVEL:-INFO}
    LOGGER_FORMAT: ${LOGGER_FORMAT:-json}
    # The ML service of this file; ML_GRPC_ADDR of .env is for Go on the host.
    ML_GRPC_ADDR: ml:50051
    ML_GRPC_TIMEOUT: ${ML_GRPC_TIMEOUT:-930s}
    # Recovery acts on the shared queue, so a backend on the host reading the
    # same .env applies the same limits.
    PREDICTION_JOB_WORKER_ENABLED: ${PREDICTION_JOB_WORKER_ENABLED:-true}
    PREDICTION_JOB_WORKERS: ${PREDICTION_JOB_WORKERS:-1}
    PREDICTION_JOB_QUEUE_CAPACITY: ${PREDICTION_JOB_QUEUE_CAPACITY:-20}
    PREDICTION_JOB_MAX_ATTEMPTS: ${PREDICTION_JOB_MAX_ATTEMPTS:-3}
    PREDICTION_JOB_LEASE_DURATION: ${PREDICTION_JOB_LEASE_DURATION:-60s}
    PREDICTION_JOB_RETRY_DELAY: ${PREDICTION_JOB_RETRY_DELAY:-30s}
    PREDICTION_JOB_POLL_INTERVAL: ${PREDICTION_JOB_POLL_INTERVAL:-2s}
    PREDICTION_JOB_SHUTDOWN_TIMEOUT: ${PREDICTION_JOB_SHUTDOWN_TIMEOUT:-5s}
    WEB_DIR: /app/frontend/dist
    CATALOG_FILE: /app/data/catalog/catalog.xlsx
    CATALOG_OSM_FILE: /app/data/osm/tram_routes.json

# CPU CatBoost: no GPU needed. The pinned weights come with the repository in
# ml/models and are mounted read-only, outside the image build context. The
# GPU recipe stays in ml/compose.yaml for a backend on the host.
x-ml: &ml
  image: tramcast-ml-cpu:local
  build:
    context: .
    dockerfile: ml/Dockerfile
    target: cpu
  environment:
    ML_CONFIG: /app/ml/recipes/catboost-cpu/recipe.json
  volumes:
    - ./ml/models:/app/ml/models:ro
    - ml-cache:/app/ml/cache

services:
  ml:
    <<: *ml
    expose:
      - "50051"
    healthcheck:
      # Route 5 is a structural zero: this checks gRPC without running the model.
      test: [CMD, python, client.py, --route, "5", --from, "2025-11-01T00:00:00+03:00", --to, "2025-11-01T01:00:00+03:00", --timeout, "3", --output, /tmp/health.json]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # Saves the model and dataset IDs the ML service computes for this host into
  # the cache volume; forecast-version-init registers the version from them.
  ml-describe:
    <<: *ml
    command: [sh, -c, "python service.py --describe > /tmp/forecast-version.json && cp /tmp/forecast-version.json /app/ml/cache/forecast-version.json"]
    restart: "no"

  postgres:
    image: postgres:18.1-bookworm
    container_name: tramcast-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  env-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: tramcast-env-port-forwarder
    profiles: [dev]
    entrypoint: ["socat"]
    command: ["-d", "-d", "TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      - "127.0.0.1:${POSTGRES_FORWARD_PORT:-5433}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: tramcast-goose:3.28.0
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_DBSTRING: "host=postgres port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  catalog-init:
    <<: *app
    entrypoint: ["/app/import-catalog"]
    command: ["-if-empty"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Registers the version the ML service serves and makes it active, after the
  # Predict check of route 5. The same IDs return the existing version, so a
  # restart creates nothing new; replay metadata is refused.
  forecast-version-init:
    <<: *app
    entrypoint: ["/app/register-forecast-version"]
    command: ["-metadata", "/ml-cache/forecast-version.json", "-activate"]
    volumes:
      - ml-cache:/ml-cache:ro
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      ml-describe:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    restart: "no"

  # Admits the job of every forecast route of the active version, so the
  # worker computes the forecast before the first user asks for it.
  prediction-jobs-init:
    <<: *app
    entrypoint: ["/app/enqueue-prediction-jobs"]
    depends_on:
      forecast-version-init:
        condition: service_completed_successfully
    restart: "no"

  # The backend does not wait for ML: without it the interface still serves
  # the catalog and published forecasts and picks up a version once registered.
  backend:
    <<: *app
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Keep this longer than HTTP_SHUTDOWN_TIMEOUT so Go can drain requests.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  ml-cache:
