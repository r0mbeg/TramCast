name: tramcast

x-app: &app
  image: tramcast-app:local
  build:
    context: .
    target: app
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
    POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-0}
    POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-5s}
    POSTGRES_STARTUP_TIMEOUT: ${POSTGRES_STARTUP_TIMEOUT:-10s}
    HTTP_ADDR: ":8080"
    HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
    HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
    HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
    HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
    HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
    HTTP_PROBE_TIMEOUT: ${HTTP_PROBE_TIMEOUT:-2s}
    LOGGER_LEVEL: ${LOGGER_LEVEL:-INFO}
    LOGGER_FORMAT: ${LOGGER_FORMAT:-json}
    WEB_DIR: /app/frontend/dist
    CATALOG_FILE: /app/data/catalog/catalog.xlsx
    CATALOG_OSM_FILE: /app/data/osm/tram_routes.json

services:
  ml:
    profiles: [ml]
    build:
      context: .
      dockerfile: ml/Dockerfile
      target: cpu
    volumes:
      - ./ml/models:/app/ml/models:ro
      - ml-cache:/app/ml/cache
    expose:
      - "50051"
    restart: unless-stopped

  postgres:
    image: postgres:18.1-bookworm
    container_name: tramcast-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  env-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: tramcast-env-port-forwarder
    profiles: [dev]
    entrypoint: ["socat"]
    command: ["-d", "-d", "TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      - "127.0.0.1:${POSTGRES_FORWARD_PORT:-5433}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: tramcast-goose:3.28.0
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_MIGRATION_DIR: /migrations
      GOOSE_DBSTRING: "host=postgres port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  catalog-init:
    <<: *app
    entrypoint: ["/app/import-catalog"]
    command: ["-if-empty"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *app
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Keep this longer than HTTP_SHUTDOWN_TIMEOUT so Go can drain requests.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  ml-cache:
