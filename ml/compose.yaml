# Standalone ML: no PostgreSQL or root .env required.
name: tramcast-ml

services:
  ml-replay:
    profiles: [replay]
    build:
      context: ..
      dockerfile: ml/Dockerfile
      target: serving
    image: tramcast-ml-replay:local
    command: [python, service.py, --bind, "0.0.0.0:50051", --bundle, /app/ml/bundles/030/forecast_bundle.json]
    ports:
      - "127.0.0.1:${ML_PORT:-50051}:50051"
    healthcheck: &ml-health
      # Route 5 is structural zero: this checks gRPC without starting GPU work.
      test: [CMD, python, client.py, --route, "5", --from, "2025-11-01T00:00:00+03:00", --to, "2025-11-01T01:00:00+03:00", --timeout, "3", --output, /tmp/health.json]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  ml-cpu:
    build:
      context: ..
      dockerfile: ml/Dockerfile
      target: cpu
    image: tramcast-ml-cpu:local
    environment:
      ML_CONFIG: "${ML_CPU_CONFIG:-/app/ml/recipes/catboost-cpu/recipe.json}"
    ports:
      - "127.0.0.1:${ML_PORT:-50051}:50051"
    volumes:
      - ./models:/app/ml/models:ro
      - ml-cache:/app/ml/cache
    healthcheck: *ml-health
    restart: unless-stopped

  ml-install:
    profiles: [tools]
    build:
      context: ..
      dockerfile: ml/Dockerfile
      target: serving
    image: tramcast-ml-replay:local
    # Only the installer writes the weights volume; serving runs unprivileged.
    user: "0:0"
    command: [python, recipe.py]
    volumes:
      - ml-models:/app/ml/models

  ml-gpu:
    profiles: [gpu]
    build:
      context: ..
      dockerfile: ml/Dockerfile
      target: inference
    image: tramcast-ml-gpu:local
    command: [python, service.py, --bind, "0.0.0.0:50051"]
    environment:
      ML_CONFIG: "${ML_CONFIG:-/app/ml/recipes/tabpfn-030/recipe.json}"
    ports:
      - "127.0.0.1:${ML_PORT:-50051}:50051"
    volumes:
      - ml-models:/app/ml/models:ro
      - ml-cache:/app/ml/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck: *ml-health
    restart: unless-stopped

volumes:
  ml-models:
  ml-cache:
