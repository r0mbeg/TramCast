version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/features/routes/repository/postgres/queries"
    gen:
      go:
        package: "routes"
        out: "internal/features/routes/repository/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/features/stops/repository/postgres/queries"
    gen:
      go:
        package: "stops"
        out: "internal/features/stops/repository/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/features/forecasts/repository/postgres/queries"
    gen:
      go:
        package: "forecasts"
        out: "internal/features/forecasts/repository/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
